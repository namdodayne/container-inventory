<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="t">
  <title id="t">Splunk flow: Universal Forwarder runs container-inventory and sends container:inventory events to indexers and search heads</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#13284a"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
  </defs>
  <rect width="1200" height="280" rx="20" fill="url(#bg)"/>
  <g stroke="#1e3a5f" stroke-width="1" opacity="0.45"><path d="M0 60H1200M0 120H1200M0 180H1200M0 240H1200"/></g>
  <g transform="translate(40 40)">
    <rect width="380" height="200" rx="10" fill="#0f1b30" stroke="#24406a"/>
    <rect width="380" height="6" rx="3" fill="#38bdf8"/>
    <text x="18" y="38" fill="#f8fafc" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="600">Docker host</text>
    <text x="18" y="60" fill="#94a3b8" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13">one package per OS / arch</text>
    <circle cx="24" cy="83" r="3" fill="#38bdf8"/>
    <text x="36" y="88" fill="#e2e8f0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5">Splunk Universal Forwarder</text>
    <circle cx="24" cy="109" r="3" fill="#38bdf8"/>
    <text x="36" y="114" fill="#e2e8f0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5">TA-container-inventory-&lt;os&gt;</text>
    <circle cx="24" cy="135" r="3" fill="#38bdf8"/>
    <text x="36" y="140" fill="#e2e8f0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5">container-inventory --ndjson -a</text>
    <circle cx="24" cy="161" r="3" fill="#38bdf8"/>
    <text x="36" y="166" fill="#e2e8f0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5">every hour</text>
    <text x="364" y="166" fill="#94a3b8" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="end">interval = 3600</text>
  </g>
  <path d="M428 140H482" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(490 40)">
    <rect width="320" height="200" rx="10" fill="#0f1b30" stroke="#24406a"/>
    <rect width="320" height="6" rx="3" fill="#4ade80"/>
    <text x="18" y="38" fill="#f8fafc" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="600">Indexer / HF</text>
    <text x="18" y="60" fill="#94a3b8" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13">props.conf</text>
    <circle cx="24" cy="83" r="3" fill="#4ade80"/>
    <text x="36" y="88" fill="#e2e8f0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5">TA-container-inventory</text>
    <circle cx="24" cy="109" r="3" fill="#4ade80"/>
    <text x="36" y="114" fill="#e2e8f0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5">LINE_BREAKER</text>
    <text x="304" y="114" fill="#94a3b8" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="end">1 line = 1 event</text>
    <circle cx="24" cy="135" r="3" fill="#4ade80"/>
    <text x="36" y="140" fill="#e2e8f0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5">TRUNCATE = 1000000</text>
    <text x="304" y="140" fill="#94a3b8" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="end">--deep records</text>
    <circle cx="24" cy="161" r="3" fill="#4ade80"/>
    <text x="36" y="166" fill="#e2e8f0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5">DATETIME_CONFIG</text>
    <text x="304" y="166" fill="#94a3b8" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="end">CURRENT</text>
  </g>
  <path d="M818 140H872" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(880 40)">
    <rect width="280" height="200" rx="10" fill="#0f1b30" stroke="#24406a"/>
    <rect width="280" height="6" rx="3" fill="#fbbf24"/>
    <text x="18" y="38" fill="#f8fafc" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="600">Search head</text>
    <text x="18" y="60" fill="#94a3b8" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13">search time</text>
    <circle cx="24" cy="83" r="3" fill="#fbbf24"/>
    <text x="36" y="88" fill="#e2e8f0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5">TA-container-inventory</text>
    <circle cx="24" cy="109" r="3" fill="#fbbf24"/>
    <text x="36" y="114" fill="#e2e8f0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5">KV_MODE = json</text>
    <text x="264" y="114" fill="#94a3b8" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="end">fields</text>
    <circle cx="24" cy="135" r="3" fill="#fbbf24"/>
    <text x="36" y="140" fill="#e2e8f0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5">containers{}</text>
    <text x="264" y="140" fill="#94a3b8" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="end">spath</text>
    <circle cx="24" cy="161" r="3" fill="#fbbf24"/>
    <text x="36" y="166" fill="#e2e8f0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5">stale, product_version</text>
  </g>
</svg>
