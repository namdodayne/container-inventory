<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="container-inventory">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#13284a"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="20" fill="url(#bg)"/>
  <g stroke="#1e3a5f" stroke-width="1" opacity="0.6">
    <path d="M0 60H1200M0 120H1200M0 180H1200M0 240H1200"/>
    <path d="M300 0V300M600 0V300M900 0V300"/>
  </g>
  <!-- stacked containers -->
  <g transform="translate(90 62)">
    <rect x="0" y="118" width="190" height="52" rx="6" fill="url(#box)"/>
    <rect x="20" y="60" width="190" height="52" rx="6" fill="#22c55e"/>
    <rect x="40" y="2" width="150" height="52" rx="6" fill="#f59e0b"/>
    <g stroke="#0b1220" stroke-opacity="0.35" stroke-width="3">
      <path d="M38 126V162M76 126V162M114 126V162M152 126V162"/>
      <path d="M58 68V104M96 68V104M134 68V104M172 68V104"/>
      <path d="M78 10V46M116 10V46M154 10V46"/>
    </g>
    <circle cx="232" cy="40" r="26" fill="none" stroke="#e2e8f0" stroke-width="7"/>
    <path d="M251 59L276 84" stroke="#e2e8f0" stroke-width="9" stroke-linecap="round"/>
  </g>
  <text x="420" y="135" fill="#f8fafc" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="56" font-weight="700">container-inventory</text>
  <text x="422" y="182" fill="#94a3b8" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="24">Kiểm kê image, registry, tech stack và version app trên Docker host</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17">
    <rect x="422" y="208" width="128" height="32" rx="16" fill="#0c4a6e"/><text x="442" y="230" fill="#7dd3fc">stdlib only</text>
    <rect x="562" y="208" width="168" height="32" rx="16" fill="#14532d"/><text x="582" y="230" fill="#86efac">linux·win·macos</text>
    <rect x="742" y="208" width="140" height="32" rx="16" fill="#78350f"/><text x="762" y="230" fill="#fcd34d">Splunk UF</text>
    <rect x="894" y="208" width="128" height="32" rx="16" fill="#4c1d95"/><text x="914" y="230" fill="#c4b5fd">read-only</text>
  </g>
</svg>
