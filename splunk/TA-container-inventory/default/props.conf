# Indexers / heavy forwarders: one event per line. Search heads: JSON field extraction.
# Install on indexers / heavy forwarders and search heads. Forwarder packages carry a copy.
[container:inventory]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
# --deep records carry every package; default 10000 chars would cut them.
TRUNCATE = 1000000
DATETIME_CONFIG = CURRENT
KV_MODE = json
category = Structured
pulldown_type = true
