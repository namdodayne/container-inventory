name: build

# Every push / PR: selftest + binaries for 5 targets (kept as workflow artifacts).
# Tag v*: same, plus a GitHub Release with binaries, Splunk add-on packages and SHA256SUMS.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYINSTALLER: pyinstaller==6.11.1
  APP: TA-container-inventory

jobs:
  selftest:
    runs-on: ubuntu-latest
    # Oldest supported and current Python; official images, since runners drop old versions.
    container: python:${{ matrix.python }}-slim
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - run: python inventory.py --selftest

  binary:
    needs: selftest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds run inside Debian 10 (glibc 2.28): binary runs on RHEL/Rocky 8+, Ubuntu 18.10+, Debian 10+.
          - { target: linux-amd64,   os: ubuntu-latest,    docker: true }
          - { target: linux-arm64,   os: ubuntu-24.04-arm, docker: true }
          - { target: windows-amd64, os: windows-latest }
          - { target: macos-arm64,   os: macos-latest }
          - { target: macos-amd64,   os: macos-15-intel }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Build (Linux, old glibc)
        if: matrix.docker
        run: |
          docker run --rm -v "$PWD":/src -w /src python:3.11-buster sh -c "
            pip install -q --root-user-action=ignore $PYINSTALLER &&
            pyinstaller --onefile --name container-inventory --log-level WARN inventory.py &&
            chown -R $(id -u):$(id -g) dist build"

      - uses: actions/setup-python@v5
        if: ${{ !matrix.docker }}
        with:
          python-version: "3.12"
      - name: Build (Windows / macOS)
        if: ${{ !matrix.docker }}
        run: |
          pip install -q "$PYINSTALLER"
          pyinstaller --onefile --name container-inventory --log-level WARN inventory.py

      - name: Smoke test the binary
        run: |
          bin=dist/container-inventory; [ -f "$bin.exe" ] && bin="$bin.exe"
          "$bin" --version
          "$bin" --selftest

      - name: Package binary + Splunk add-on
        run: |
          ext=""; [ -f dist/container-inventory.exe ] && ext=".exe"
          mkdir -p out
          cp "dist/container-inventory$ext" "out/container-inventory-${{ matrix.target }}$ext"
          # Forwarder add-on TA-container-inventory-<target>: base add-on + inputs.conf + binary + .path.
          # One app name per target, so a deployment server can hold every platform side by side.
          # The .path file must hold an absolute path, which includes the app name.
          name="$APP-${{ matrix.target }}"; ta="stage/$name"
          mkdir -p stage && cp -R "splunk/$APP" "$ta" && cp -R splunk/forwarder/default "$ta/"
          mkdir -p "$ta/bin" && cp "dist/container-inventory$ext" "$ta/bin/"
          sed -i.bak -e "s/^id = .*/id = $name/" -e "s/^label = .*/label = Container Inventory (${{ matrix.target }})/" \
            "$ta/default/app.conf" && rm "$ta/default/app.conf.bak"
          if [ -n "$ext" ]; then
            printf '%s\r\n' "\$SPLUNK_HOME\\etc\\apps\\$name\\bin\\container-inventory.exe --ndjson -a" > "$ta/bin/container_inventory.path"
          else
            printf '%s\n' "\$SPLUNK_HOME/etc/apps/$name/bin/container-inventory --ndjson -a" > "$ta/bin/container_inventory.path"
            chmod +x "$ta/bin/container-inventory"
          fi
          cat "$ta/bin/container_inventory.path"
          tar -C stage -czf "out/$name.tgz" "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: out/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: binary
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Base add-on for indexers / search heads (props only, no input)
        run: tar -C splunk -czf "out/$APP.tgz" "$APP"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          cd out && sha256sum * > SHA256SUMS
          gh release create "$TAG" * --repo "$REPO" --title "$TAG" --generate-notes
